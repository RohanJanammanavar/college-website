<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="login-box">
        <h2>Login</h2>
        <div class="input-box">
            <label>Username</label>
            <input id="name" type="text" placeholder="Enter Username">
        </div>

        <div class="input-box">
            <label>Password</label>
            <div class="password-box">
                <input class="password" type="password" placeholder="Enter password" autoComplete="off">
                <button type="button" class="togglePassword">👁</button>
            </div>
        </div>

        <span class="login-error">Invalid username or password</span>
        <button class="login-btn">Login</button>
        <p class="forgot">
            <a href="{{ url_for('forgot')}}">Forgot Password</a>
        </p>
        <p class="signup">Don't have an account
            <a href="{{ url_for('signup')}}" target="_blank">signup</a>
        </p>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
